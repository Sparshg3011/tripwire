# tripwire recipe 1, primary arm
# tools sha256:   48b2041e347af4ab3d115e7dfc0f14dba144306f4997c7e0b5bd974b4930ce68
# lexicon sha256: 3315dbfbf6e12a23fe6721f80e62b85379b8ddf342b45f82df13c0d162586d5b
# Drafted from tool names, input schemas and annotations, never descriptions.
# Review every inferred role before enforcing it.
version: 1
defaults:
  unknown_tools: block
sources:
  "*": untrusted
tools:
  add_calendar_event_participants:
    action: allow  # write: no read verb
    self_scoped: true
    args:
      event_id: {role: selector, type: id}  # ends in "id"
      participants: target  # target cue "participants"
    limits: {per_session: 5}
  browse_webpage:
    action: allow  # fetch: "browse" with a URL argument
    args:
      url: {role: target, type: url}  # URL cue "url"
  cancel_calendar_event:
    action: allow  # write: "cancel"
    destructive: true  # "cancel"
    args:
      event_id: {role: selector, type: id}  # ends in "id"
    limits: {per_session: 5}
  copy_node:
    action: allow  # write: no read verb
    self_scoped: true
    args:
      destination_path: {role: selector, type: path, match: under}  # path cue "path"
      source_path: {role: selector, type: path, match: under}  # path cue "path"
    limits: {per_session: 5}
  create_calendar_event:
    action: allow  # write: "create"
    self_scoped: true
    args:
      description: content  # no cue
      end_time: content  # no cue
      location: content  # no cue
      participants: target  # target cue "participants"
      start_time: content  # no cue
      title: content  # no cue
    limits: {per_session: 5}
  create_dir:
    action: allow  # write: "create"
    self_scoped: true
    args:
      path: {role: selector, type: path, match: under}  # path cue "path"
    limits: {per_session: 5}
  create_file:
    action: allow  # write: "create"
    self_scoped: true
    args:
      content: content  # no cue
      path: {role: selector, type: path, match: under}  # path cue "path"
    limits: {per_session: 5}
  delete_email:
    action: allow  # write: "delete"
    destructive: true  # "delete"
    args:
      email_id: {role: selector, type: id}  # ends in "id"
    limits: {per_session: 5}
  delete_node:
    action: allow  # write: "delete"
    destructive: true  # "delete"
    args:
      path: {role: selector, type: path}  # path cue "path"
    limits: {per_session: 5}
  download_file_through_id:
    action: allow  # write: no read verb
    self_scoped: true
    args:
      file_id: {role: selector, type: id}  # ends in "id"
      save_dir: {role: selector, type: path, match: under}  # path cue "dir"
    limits: {per_session: 5}
  download_file_through_url:
    action: allow  # write: no read verb
    self_scoped: true
    args:
      save_dir: {role: selector, type: path, match: under}  # path cue "dir"
      url: {role: target, type: url}  # URL cue "url"
    limits: {per_session: 5}
  get_balance:
    action: allow  # read: "get"
  get_current_day:
    action: allow  # read: "get"
  get_day_calendar_events:
    action: allow  # read: "get"
  get_received_emails:
    action: allow  # read: "get"
  get_sent_emails:
    action: allow  # read: "get"
  get_unread_emails:
    action: allow  # read: "get"
  input_to_webpage:
    action: allow  # write: no read verb
    self_scoped: true
    args:
      input_ids: {role: selector, type: id}  # ends in "ids"
      input_values: content  # no cue
      url: {role: target, type: url}  # URL cue "url"
    limits: {per_session: 5}
  list_directory:
    action: allow  # read: "list"
  move_node:
    action: allow  # write: no read verb
    self_scoped: true
    args:
      destination_path: {role: selector, type: path, match: under}  # path cue "path"
      source_path: {role: selector, type: path, match: under}  # path cue "path"
    limits: {per_session: 5}
  read_file:
    action: allow  # read: "read"
  reschedule_calendar_event:
    action: allow  # write: no read verb
    self_scoped: true
    args:
      event_id: {role: selector, type: id}  # ends in "id"
      new_end_time: content  # no cue
      new_start_time: content  # no cue
    limits: {per_session: 5}
  search_calendar_events:
    action: allow  # read: "search"
  search_emails:
    action: allow  # read: "search"
  send_email:
    action: allow  # write: "send"
    self_scoped: true
    args:
      attachments: content  # no cue
      bcc: target  # target cue "bcc"
      body: content  # no cue
      cc: target  # target cue "cc"
      recipients: target  # target cue "recipients"
      subject: content  # no cue
    limits: {per_session: 5}
  send_money:
    action: allow  # write: "send"
    self_scoped: true
    args:
      amount: content  # amount cue "amount"
      date: content  # no cue
      recipient: target  # target cue "recipient"
      subject: content  # no cue
    limits: {per_session: 5}
  verify_transaction:
    action: allow  # write: "verify"
    self_scoped: true
    args:
      otp: content  # credential cue "otp", on a "verify" tool
    limits: {per_session: 1}  # a credential argument
flows:
  - when: context_tainted
    tools:
      - add_calendar_event_participants
      - browse_webpage
      - cancel_calendar_event
      - copy_node
      - create_calendar_event
      - create_dir
      - create_file
      - delete_email
      - delete_node
      - download_file_through_id
      - download_file_through_url
      - input_to_webpage
      - move_node
      - reschedule_calendar_event
      - send_email
      - send_money
      - verify_transaction
    action: require_approval
    unless: anchored
