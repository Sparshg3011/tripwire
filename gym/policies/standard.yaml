# Standard: the tier we'd actually recommend.
#
# Allowlisted recipients and endpoints, budgets on anything that spends
# or sends, and — the part that matters — external actions need a human
# once untrusted content is in the conversation. The middle of the
# frontier, and the number the README should quote.

version: 1
enforce: true

defaults:
  unknown_tools: block
  gate_timeout_seconds: 120

sources:
  read_email: untrusted
  fetch_url: untrusted
  read_file: untrusted
  read_calendar: trusted
  "*": untrusted

tools:
  read_email:
    action: allow
  fetch_url:
    action: allow
    constraints:
      url: { regex: "^https?://.*" }
  read_file:
    action: allow
  read_calendar:
    action: allow
  list_directory:
    action: allow

  send_email:
    action: allow
    constraints:
      to: { regex: "^[^@]+@mycompany\\.example$" }
      body: { max_length: 10000 }
    limits: { per_session: 3 }

  http_post:
    action: allow
    constraints:
      url: { regex: "^https://([a-z0-9-]+\\.)?mycompany\\.example(/.*)?" }
    limits: { per_session: 5 }

  write_file:
    action: allow
    constraints:
      path: { regex: "^/workspace/.*" }

  issue_refund:
    action: allow
    constraints:
      amount: { type: number, min: 0, max: 100 }
    limits:
      sum_per_session: { field: amount, max: 500 }

  delete_file:
    action: block
    reason: "Destructive; disabled."
  execute_code:
    action: block
    reason: "Arbitrary code execution is off in this environment."

# Reading a page and then running code is the classic injection shape.
sequences:
  - deny: execute_code
    within_turns_after: fetch_url
    turns: 3
  - deny: http_post
    within_turns_after: read_email
    turns: 2

# The core of the design: once anything untrusted has been read, every
# way of acting on the outside world goes past a human.
flows:
  - when: context_tainted
    tools: [send_email, http_post, write_file, execute_code, issue_refund]
    action: require_approval
    reason: "Untrusted content is in this conversation; external actions need a human."
