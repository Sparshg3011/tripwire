# Anchored: standard's rules, with argument anchoring turned on.
#
# This is standard.yaml with three additions and one deliberate removal:
#
#   * a `known` block: the operator attests their own mail domain, their
#     own hosts, and the workspace root. What it names anchors.
#   * argument contracts (`args`) on every tool that sends, writes, pays
#     or fetches, naming which argument decides who the call reaches
#     (target), which object it acts on (selector), and which is just
#     content.
#   * `unless: anchored` on the taint flow, so a gated call goes through
#     when every one of those authority values came from the task, a
#     known value, a trusted tool, or an id this session minted.
#
# The removal: standard pins send_email `to` and http_post `url` to the
# company domain with a regex. Anchoring is the recipient control here,
# so those host allowlists are gone — otherwise the regex would decide
# the recipient cases and we would be measuring the allowlist again, not
# anchoring. The workspace jail on write_file goes for the same reason:
# the path selector anchors under the known workspace root, and control
# files under it are refused by anchoring, not by a prefix match. TLS is
# still required, and the per-session budgets stay.
#
# Written to be a policy an operator would actually deploy for this
# toolbox, not one reverse-engineered from the adaptive corpus.

version: 1
enforce: true

defaults:
  unknown_tools: block
  gate_timeout_seconds: 120

known:
  email: ["@corp.example"] # any mailbox at our own domain
  host: [".corp.example"] # our domain and every host under it
  path: ["/workspace"] # the agent's working root

sources:
  read_email: untrusted
  fetch_url: untrusted
  read_file: untrusted
  list_directory: untrusted
  read_calendar: trusted
  read_directory: trusted # the corporate contact directory
  lookup_contact: trusted # a directory lookup by address
  "*": untrusted

tools:
  read_email:
    action: allow
  read_file:
    action: allow
  list_directory:
    action: allow
  read_calendar:
    action: allow
  read_directory:
    action: allow
  lookup_contact:
    action: allow

  fetch_url:
    action: allow
    constraints:
      url: { regex: "^https?://.*" }
    args:
      url: { role: target, type: url }

  send_email:
    action: allow
    constraints:
      body: { max_length: 10000 }
    limits: { per_session: 5 }
    args:
      to: target
      cc: { role: target, type: email }
      subject: content
      body: content

  http_post:
    action: allow
    constraints:
      url: { regex: "^https://.*" } # TLS only; the host is anchored, not allowlisted
    limits: { per_session: 5 }
    args:
      url: { role: target, type: url }
      body: content

  write_file:
    action: allow
    args:
      path: { role: selector, type: path, match: under }
      contents: content

  pay_invoice:
    action: allow
    constraints:
      amount: { type: number, min: 0, max: 10000 }
    limits:
      sum_per_session: { field: amount, max: 20000 }
    args:
      payee: { role: target, type: iban }
      amount: content

  post_status:
    action: allow
    limits: { per_session: 5 }
    args:
      message: content # self-scoped: a status post names no one
    self_scoped: true

  add_contact:
    action: allow
    args:
      name: content
      email: content # stored, not a recipient; a contact is not a send
    self_scoped: true

  create_ticket:
    action: allow
    args:
      title: content
    self_scoped: true

  ack_ticket:
    action: allow
    args:
      ticket_id: selector

  delete_ticket:
    action: allow
    destructive: true
    args:
      ticket_id: selector

  issue_refund:
    action: allow
    constraints:
      amount: { type: number, min: 0, max: 100 }
    limits:
      sum_per_session: { field: amount, max: 500 }

  delete_file:
    action: block
    reason: "Destructive; disabled."
  execute_code:
    action: block
    reason: "Arbitrary code execution is off in this environment."

# Standard's order-of-operations rules, unchanged.
sequences:
  - deny: execute_code
    within_turns_after: fetch_url
    turns: 3
  - deny: http_post
    within_turns_after: read_email
    turns: 2

# The design: once anything untrusted has been read, every outward or
# destructive action is gated — unless every authority value it carries
# is anchored. issue_refund has nothing to anchor (an amount is not
# authority), so it has no contract and is never discharged: it stays
# gated for a human, every time.
flows:
  - when: context_tainted
    tools:
      [
        send_email,
        http_post,
        fetch_url,
        write_file,
        pay_invoice,
        post_status,
        add_contact,
        create_ticket,
        ack_ticket,
        delete_ticket,
        issue_refund,
      ]
    action: require_approval
    unless: anchored
    reason: "Untrusted content is in this conversation; external actions need an anchor or a human."
