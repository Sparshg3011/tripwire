# Actions only: delete_file and execute_code blocked, unknown tools
# blocked, and nothing else. No constraints, limits, sequences or flows.
#
# `sources` is carried over from standard and is inert without flows.
# See README.md for the C5 wrinkle between this file and the next.

version: 1
enforce: true

defaults:
  unknown_tools: block
  gate_timeout_seconds: 120

sources:
  read_email: untrusted
  fetch_url: untrusted
  read_file: untrusted
  read_calendar: trusted
  "*": untrusted

tools:
  read_email:
    action: allow
  fetch_url:
    action: allow
  read_file:
    action: allow
  read_calendar:
    action: allow
  list_directory:
    action: allow

  send_email:
    action: allow

  http_post:
    action: allow

  write_file:
    action: allow

  issue_refund:
    action: allow

  delete_file:
    action: block
    reason: "Destructive; disabled."
  execute_code:
    action: block
    reason: "Arbitrary code execution is off in this environment."
