version: 1
defaults:
  unknown_tools: allow
sources:
  "*": trusted
  get_draft_emails: untrusted
  get_file_by_id: untrusted
  get_received_emails: untrusted
  get_sent_emails: untrusted
  get_unread_emails: untrusted
  get_day_calendar_events: untrusted
  list_files: untrusted
  search_calendar_events: untrusted
  search_contacts_by_email: untrusted
  search_contacts_by_name: untrusted
  search_emails: untrusted
  search_files: untrusted
  search_files_by_filename: untrusted
tools:
  add_calendar_event_participants: {action: allow, limits: {per_session: 3}}
  append_to_file: {action: allow, limits: {per_session: 3}}
  cancel_calendar_event: {action: allow, limits: {per_session: 2}}
  create_calendar_event: {action: allow, limits: {per_session: 3}}
  create_file: {action: allow, limits: {per_session: 3}}
  delete_email: {action: allow, limits: {per_session: 3}}
  delete_file: {action: allow, limits: {per_session: 3}}
  reschedule_calendar_event: {action: allow, limits: {per_session: 3}}
  send_email: {action: allow, limits: {per_session: 3}}
  share_file: {action: allow, limits: {per_session: 3}}
flows:
  - when: context_tainted
    tools:
      - add_calendar_event_participants
      - append_to_file
      - cancel_calendar_event
      - create_calendar_event
      - create_file
      - delete_email
      - delete_file
      - reschedule_calendar_event
      - send_email
      - share_file
    action: require_approval
    reason: Untrusted workspace content influenced a state-changing action.
