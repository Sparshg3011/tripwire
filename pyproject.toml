[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=25.1"]
build-backend = "hatchling.build"

[project]
name = "tripwire-agent"
version = "0.1.0"
description = "A deterministic firewall for AI-agent tool calls over MCP"
dynamic = ["readme"]
# PEP 639: the SPDX expression replaces the deprecated License :: classifiers
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Sparsh Gupta" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "ai-agents",
    "llm",
    "security",
    "firewall",
    "prompt-injection",
    "policy",
    "audit-log",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    # 1.19 is the first whose low-level server takes the CallToolResult
    # the proxy's call_tool handler returns
    "mcp>=1.19,<2",
    "pydantic>=2.8,<3",
    "pyyaml>=6.0",
    "anyio>=4.4",
]

[project.urls]
Homepage = "https://github.com/Sparshg3011/tripwire"
Documentation = "https://github.com/Sparshg3011/tripwire/tree/main/docs"
Source = "https://github.com/Sparshg3011/tripwire"
Changelog = "https://github.com/Sparshg3011/tripwire/blob/main/CHANGELOG.md"
Issues = "https://github.com/Sparshg3011/tripwire/issues"

[project.scripts]
tripwire = "tripwire.cli:main"

[project.optional-dependencies]
# the benchmark: a real agent, a mock toolbox, and the frontier chart
gym = [
    "anthropic>=0.40",
    # any OpenAI-compatible endpoint: NVIDIA NIM, ollama, vLLM, OpenAI
    "openai>=1.40",
    "matplotlib>=3.8",
]
# Reproducible external benchmark adapter. AgentDyn is a source-compatible
# AgentDojo fork and is installed in a separate environment from its pinned
# repository revision; see docs/benchmarking.md.
publication = [
    "agentdojo[transformers]==0.1.35",
    "openai>=1.40",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.100",
    "ruff==0.16.9",
    "mypy==2.3.1",
    "types-PyYAML",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tripwire", "src/tripwire_gym", "src/tripwire_benchmarks"]

# Ship the same checked-in corpus and policies, without local API transcripts.
[tool.hatch.build.targets.wheel.force-include]
"gym/scenarios" = "tripwire_gym/data/scenarios"
"gym/policies" = "tripwire_gym/data/policies"
"gym/ablations" = "tripwire_gym/data/ablations"
"gym/external_policies" = "tripwire_gym/data/external_policies"
"gym/recipe_policies" = "tripwire_gym/data/recipe_policies"
"gym/agentdojo-heldout.yaml" = "tripwire_gym/data/agentdojo-heldout.yaml"
"gym/agentdojo-protectai-heldout.yaml" = "tripwire_gym/data/agentdojo-protectai-heldout.yaml"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/gym", "/docs", "/examples", "/*.md", "/LICENSE", "/pyproject.toml"]
exclude = ["/gym/results", "**/__pycache__", "**/*.pyc", "/.env", "/.cache"]

# PyPI shows the README without the repository around it: relative links
# and images point at the release tag on GitHub instead, and the Mermaid
# diagram, which PyPI doesn't render, becomes a link to where it does.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(?s)```mermaid\n.*?```\n'
replacement = 'See the [architecture diagram](https://github.com/Sparshg3011/tripwire/blob/v$HFPR_VERSION/README.md#architecture) on GitHub.\n'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(!\[[^\]]*\])\((?!https?://)([^)\s]+)\)'
replacement = '\1(https://raw.githubusercontent.com/Sparshg3011/tripwire/v$HFPR_VERSION/\2)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#|mailto:)([^)\s]+)\)'
replacement = '](https://github.com/Sparshg3011/tripwire/blob/v$HFPR_VERSION/\1)'

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
# The interceptor catches Exception on purpose, in several places. Any
# error anywhere in the policy engine has to become a block rather than
# a traceback — that is invariant 1, not an oversight.
"src/tripwire/proxy/interceptor.py" = ["BLE001"]
# replay runs the same policy engine over recorded traffic and reports
# what it would have decided. A candidate policy that makes the engine
# throw is a real answer — "this one would have blocked" — not a crash.
"src/tripwire/replay.py" = ["BLE001"]
# canonicalize() is total by contract: args arrive off the wire, so a
# value it can't walk is a value it leaves alone, never an exception.
"src/tripwire/policy/canonical.py" = ["BLE001"]
# evaluate() is total by contract too: a stage that raises has answered,
# and the answer is a block verdict rather than a traceback.
"src/tripwire/policy/evaluator.py" = ["BLE001"]
# normalize() as well: a value it can't read is Invalid, and an Invalid
# target blocks.
"src/tripwire/policy/values.py" = ["BLE001"]
