[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tripwire-agent"
version = "0.1.0"
description = "A deterministic MCP firewall for AI agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Sparsh Gupta" }]
keywords = ["mcp", "agents", "security", "firewall", "prompt-injection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "mcp>=1.10,<2",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "anyio>=4.4",
]

[project.urls]
Source = "https://github.com/Sparshg3011/tripwire"

[project.scripts]
tripwire = "tripwire.cli:main"

[project.optional-dependencies]
# the benchmark: a real agent, a mock toolbox, and the frontier chart
gym = [
    "anthropic>=0.40",
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tripwire", "src/tripwire_gym"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
# The interceptor catches Exception on purpose, in several places. Any
# error anywhere in the policy engine has to become a block rather than
# a traceback — that is invariant 1, not an oversight.
"src/tripwire/proxy/interceptor.py" = ["BLE001"]
