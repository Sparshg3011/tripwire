[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tripwire-agent"
version = "0.1.0"
description = "A deterministic MCP firewall for AI agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Sparsh Gupta" }]
keywords = ["mcp", "agents", "security", "firewall", "prompt-injection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "mcp>=1.10,<2",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "anyio>=4.4",
]

[project.urls]
Source = "https://github.com/Sparshg3011/tripwire"

[project.scripts]
tripwire = "tripwire.cli:main"

[project.optional-dependencies]
# the benchmark: a real agent, a mock toolbox, and the frontier chart
gym = [
    "anthropic>=0.40",
    # any OpenAI-compatible endpoint: NVIDIA NIM, ollama, vLLM, OpenAI
    "openai>=1.40",
    "matplotlib>=3.8",
]
# Reproducible external benchmark adapter. AgentDyn is a source-compatible
# AgentDojo fork and is installed in a separate environment from its pinned
# repository revision; see docs/benchmarking.md.
publication = [
    "agentdojo==0.1.35",
    "openai>=1.40",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tripwire", "src/tripwire_gym", "src/tripwire_benchmarks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
# The interceptor catches Exception on purpose, in several places. Any
# error anywhere in the policy engine has to become a block rather than
# a traceback — that is invariant 1, not an oversight.
"src/tripwire/proxy/interceptor.py" = ["BLE001"]
# replay runs the same policy engine over recorded traffic and reports
# what it would have decided. A candidate policy that makes the engine
# throw is a real answer — "this one would have blocked" — not a crash.
"src/tripwire/replay.py" = ["BLE001"]
# canonicalize() is total by contract: args arrive off the wire, so a
# value it can't walk is a value it leaves alone, never an exception.
"src/tripwire/policy/canonical.py" = ["BLE001"]
