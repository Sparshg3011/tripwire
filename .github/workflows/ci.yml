name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,gym]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      # strict typing where correctness is load-bearing; the rest of the
      # tree is checked by tests instead
      - run: mypy --strict src/tripwire/policy src/tripwire/tx
      - run: pytest -q

      # The benchmark harness itself, on the scripted agent: no API key,
      # no cost, no nondeterminism. It won't catch a policy getting
      # weaker, but it will catch the machinery that measures that from
      # quietly breaking — and a broken harness reports flawless
      # security, which is the worst number this repo could print.
      - run: python -m tripwire_gym --agent scripted --conditions undefended,standard --out /tmp/gym

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pip-audit
      - run: pip-audit
