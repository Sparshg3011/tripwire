name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,gym]"
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      # strict typing where correctness is load-bearing; the rest of the
      # tree is checked by tests instead
      - run: mypy --strict src/tripwire/policy src/tripwire/tx src/tripwire/gate/exact.py
      - run: pytest -q

      # The benchmark harness itself, on the scripted agent: no API key,
      # no cost, no nondeterminism. It won't catch a policy getting
      # weaker, but it will catch the machinery that measures that from
      # quietly breaking — and a broken harness reports flawless
      # security, which is the worst number this repo could print.
      - run: python -m tripwire_gym --agent scripted --conditions undefended,standard --out /tmp/gym

  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,publication]"
      - run: pytest -q tests/test_agentdojo_adapter.py tests/test_autodojo.py tests/test_heldout.py tests/test_protectai_heldout.py tests/test_action_reviewer.py tests/test_agentdojo_review.py tests/test_benchmark_transport.py tests/test_review_smoke.py

  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - run: python scripts/check_distribution.py
      - name: Exercise the installed wheel outside the checkout
        run: |
          python -m venv /tmp/installed
          /tmp/installed/bin/pip install dist/*.whl
          cd /tmp
          /tmp/installed/bin/python "$GITHUB_WORKSPACE/scripts/smoke_installed.py"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pip-audit
      - run: pip-audit
