# Reference policy — every feature of the v1 policy language in one file.
# This exact file is used by the test suite, so it always validates.

version: 1
enforce: true # false = shadow mode: evaluate + log, never block

defaults:
  unknown_tools: block
  gate_timeout_seconds: 120

# Taint declarations: which tools return content an attacker could control.
sources:
  read_email: untrusted
  fetch_url: untrusted
  read_calendar: trusted
  "*": untrusted # anything undeclared is untrusted

tools:
  send_email:
    action: require_approval
    constraints:
      to: { regex: "^[^@]+@mycompany\\.com$" }
      body: { max_length: 10000 }
    limits: { per_session: 3 }

  issue_refund:
    action: allow
    constraints:
      amount: { type: number, min: 0, max: 100 }
    limits:
      sum_per_session: { field: amount, max: 500 }

  delete_file:
    action: block
    reason: "Destructive; disabled."

  # Fine on a clean session — the sequence and flow rules below are what
  # tighten it when untrusted content is around.
  execute_code:
    action: allow

# Order matters in attacks: fetching a URL and then immediately running
# code is the classic injection shape.
sequences:
  - deny: execute_code
    within_turns_after: fetch_url
    turns: 3

# Information-flow rules. These may only tighten a verdict, never relax.
flows:
  - when: context_tainted
    tools: [send_email, http_post, execute_code, write_file]
    action: require_approval
    reason: "Untrusted content in context; external actions need a human."
